name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  linux:
    uses: ./.github/workflows/linux.yml
  windows:
    uses: ./.github/workflows/windows.yml

  draft-release:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-release'
          path: release-assets
          merge-multiple: true
      - name: Validate release inventory
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          test "$tag" = v2026.08.0
          expected=(
            "CAMotics-Fast-$tag-windows-x86_64.zip"
            "CAMotics-Fast-$tag-windows-x86_64-setup.exe"
            "CAMotics-Fast-$tag-linux-x86_64.AppImage"
            "camotics-fast_2026.08.0_amd64.deb"
          )
          for file in "${expected[@]}"; do test -s "release-assets/$file"; done
          printf '%s\n' "${expected[@]}" >release-assets/inventory.txt
      - name: Write checksums and build information
        run: |
          cd release-assets
          sha256sum $(cat inventory.txt) >SHA256SUMS
          cd ..
          python3 scripts/release/write_buildinfo.py \
            --output release-assets/BUILDINFO.json \
            --tag "$GITHUB_REF_NAME" \
            $(sed 's#^#release-assets/#' release-assets/inventory.txt)
      - id: provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          create-storage-record: false
          subject-path: |
            release-assets/CAMotics-Fast-*.zip
            release-assets/CAMotics-Fast-*-setup.exe
            release-assets/CAMotics-Fast-*.AppImage
            release-assets/camotics-fast_*.deb
      - name: Attach provenance bundle
        run: |
          cp '${{ steps.provenance.outputs.bundle-path }}' \
            release-assets/BUILD-PROVENANCE.sigstore.json
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --draft --title "CAMotics Fast $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            release-assets/CAMotics-Fast-*.zip \
            release-assets/CAMotics-Fast-*-setup.exe \
            release-assets/CAMotics-Fast-*.AppImage \
            release-assets/camotics-fast_*.deb \
            release-assets/SHA256SUMS \
            release-assets/BUILDINFO.json \
            release-assets/BUILD-PROVENANCE.sigstore.json
